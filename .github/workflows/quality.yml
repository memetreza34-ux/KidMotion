name: KidMotion Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Script syntax
        run: npm run scripts:check

      - name: Phase 2 handoff tests
        run: npm run phase2:test

      - name: Workout human-character tests
        run: npm run workout:human:test

      - name: Flow save and numbering tests
        run: npm run flow:save:test

      - name: Typecheck
        run: npm run typecheck

      - name: Project doctor
        run: npm run project:doctor

      - name: Repository contract QA
        run: npm run repo:qa

      - name: Learning system doctor
        run: npm run learning:system:doctor

      - name: Learning repository QA
        run: npm run learning:repo:qa
